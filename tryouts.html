<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tryouts & Intake | Uni Science Club</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>
    <header>
        <div class="logo">Uni Science Club</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="scioly.html">Science Olympiad</a></li>
                <li><a href="scibowl.html">Science Bowl</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="sponsors.html">Sponsors</a></li>
                <li><a href="tryouts.html" class="active">Tryouts</a></li>
                <li><a href="resources.html">Resources</a></li>
                <li><a href="#" class="theme-toggle">🌗 Toggle Theme</a></li>
                <li><a href="tryouts.html" class="btn-nav">Join Email List</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <div class="container">
            <h2>Registration & Email Intake</h2>
            <p>DESCRIPTION HERE</p>
            
            <form class="form-block" onsubmit="event.preventDefault(); alert('Submission validated.');">
                <label>Full Name</label>
                <input type="text" placeholder="First Last" required>
                
                <label>Personal Contact Email</label>
                <input type="email" placeholder="student@gmail.com" required>
                
                <label>Grade Level</label>
                <select required>
                    <option value="" disabled selected>Select Grade</option>
                    <option value="9">Freshman (9)</option>
                    <option value="10">Sophomore (10)</option>
                    <option value="11">Junior (11)</option>
                    <option value="12">Senior (12)</option>
                </select>
                
                <button type="submit" class="btn-primary">Submit</button>
            </form>
        </div>
    </main>

    <footer><p>&copy; 2026 University High Science Club. <a href="http://uniscienceclub.org">uniscienceclub.org</a></p></footer>

    <script>
        document.querySelector('.theme-toggle').addEventListener('click', function (e) {
            e.preventDefault();
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>
</body>
</html>
