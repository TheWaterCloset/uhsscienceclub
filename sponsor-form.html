<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sponsorship Application | Uni Science Club</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        .form-block textarea {
            padding: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            border-radius: 4px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            min-height: 150px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Uni Science Club</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="scioly.html">Science Olympiad</a></li>
                <li><a href="scibowl.html">Science Bowl</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="sponsors.html">Sponsors</a></li>
                <li><a href="tryouts.html">Tryouts</a></li>
                <li><a href="resources.html">Resources</a></li>
                <li><a href="#" class="theme-toggle">🌗 Toggle Theme</a></li>
                <li><a href="tryouts.html" class="btn-nav">Join Email List</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <div class="container">
            <h2>Sponsorship Request Form</h2>
            <p>DESCRIPTION HERE</p>
            
            <form class="form-block" onsubmit="event.preventDefault(); alert('Sponsorship Form Submission Validated (Mock Backend Link).');">
                <label>Name of Company Wishing to Sponsor</label>
                <input type="text" placeholder="Enterprise Corp / Entity Name" required>
                
                <label>Body of Email</label>
                <textarea placeholder="Outline your message parameters or proposal details here..." required></textarea>
                
                <button type="submit" class="btn-primary">Submit Sponsorship Request</button>
            </form>
        </div>
    </main>

    <footer><p>&copy; 2026 University High Science Club. <a href="http://uniscienceclub.org">uniscienceclub.org</a></p></footer>

    <script>
        document.querySelector('.theme-toggle').addEventListener('click', function (e) {
            e.preventDefault();
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>
</body>
</html>
